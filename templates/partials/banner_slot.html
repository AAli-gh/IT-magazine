{% for banner in banners %}
<a href="{{ banner.link|default:'#' }}" {% if banner.link %}target="_blank" rel="sponsored noopener"{% endif %}
   class="block card overflow-hidden my-4 relative">
  {% if banner.kind == "ad" %}<span class="absolute top-2 left-2 chip !text-[10px]">تبلیغ</span>{% endif %}
  {% if banner.image %}<img src="{{ banner.image.url }}" alt="{{ banner.title }}" class="w-full object-cover" loading="lazy">
  {% else %}<div class="p-5 bg-gradient-to-l from-amber-100 to-rose-100 dark:from-amber-900/30 dark:to-rose-900/30"><p class="font-bold">{{ banner.title }}</p>{% if banner.text %}<p class="text-sm mt-1">{{ banner.text }}</p>{% endif %}</div>{% endif %}
</a>
{% endfor %}
