{# Cover image, or a gradient placeholder with the category icon. #}
{% if article.cover %}
<img src="{{ article.cover.url }}" alt="{{ article.title }}" loading="lazy" class="h-full w-full object-cover transition duration-300 group-hover:scale-105">
{% else %}
<div class="h-full w-full grid place-items-center bg-gradient-to-br from-brand-500/80 via-violet-600/80 to-fuchsia-600/80 text-5xl">{{ article.category.icon|default:"📰" }}</div>
{% endif %}
