{% extends "base.html" %}
{% block title %}ثبت‌نام | {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card p-8">
  <h1 class="text-2xl font-extrabold mb-2">ثبت‌نام</h1>
  <p class="text-sm text-slate-500 mb-6">مطالب را ذخیره کنید، موضوعات مورد علاقه را دنبال کنید و دیدگاه بگذارید.</p>
  <form method="post" class="space-y-4">
    {% include "partials/form.html" %}
    <button class="btn-primary w-full justify-center">ساخت حساب</button>
  </form>
  <p class="mt-6 text-sm text-center text-slate-500">حساب دارید؟ <a href="{% url 'accounts:login' %}" class="text-brand-600 font-semibold">وارد شوید</a></p>
</div>
{% endblock %}
