{% extends "base.html" %}
{% block title %}ورود | {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card p-8">
  <h1 class="text-2xl font-extrabold mb-6">ورود به حساب</h1>
  <form method="post" class="space-y-4">
    {% include "partials/form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn-primary w-full justify-center">ورود</button>
  </form>
  <p class="mt-6 text-sm text-center text-slate-500">حساب ندارید؟ <a href="{% url 'accounts:signup' %}" class="text-brand-600 font-semibold">ثبت‌نام کنید</a></p>
</div>
{% endblock %}
