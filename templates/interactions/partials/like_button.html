{% load mag %}
<button type="button" hx-post="{% url 'interactions:like' article.pk %}" hx-swap="outerHTML"
        class="btn-ghost {% if liked %}!bg-rose-50 dark:!bg-rose-900/30 text-rose-600{% endif %}" aria-pressed="{{ liked|yesno:'true,false' }}">
  {% if liked %}❤️{% else %}🤍{% endif %} پسندیدم <span class="text-xs text-slate-500">{{ like_count|fa_digits }}</span>
</button>
