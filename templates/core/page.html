{% extends "base.html" %}
{% block title %}{{ page.meta_title|default:page.title }} | {{ SITE_NAME }}{% endblock %}
{% block meta_description %}{{ page.meta_description|default:SITE_DESCRIPTION }}{% endblock %}
{% block content %}
<article class="mx-auto max-w-3xl card p-8">
  <h1 class="text-3xl font-extrabold mb-6">{{ page.title }}</h1>
  <div class="prose prose-slate dark:prose-invert max-w-none leading-8">{{ page.body_html|safe }}</div>
</article>
{% endblock %}
