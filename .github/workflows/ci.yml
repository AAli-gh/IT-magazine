name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itmag
          POSTGRES_USER: itmag
          POSTGRES_PASSWORD: itmag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itmag" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://itmag:itmag@localhost:5432/itmag
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production-use-only-for-tests-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build frontend and check committed CSS is up to date
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code static/ || (echo "::error::Run 'npm run build' and commit static/"; exit 1)
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - name: Deploy checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: example.com
      - name: Tests (unit + browser)
        run: python manage.py test -v 2
        env:
          REQUIRE_E2E: "1"  # fail instead of skipping if the browser tests can't run
