services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: itmag
      POSTGRES_USER: itmag
      POSTGRES_PASSWORD: itmag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    environment:
      DATABASE_URL: postgres://itmag:itmag@db:5432/itmag
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
  media:
