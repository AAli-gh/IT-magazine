# Development: PostgreSQL + Redis + the app with DEBUG on.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: itmag
      POSTGRES_USER: itmag
      POSTGRES_PASSWORD: itmag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://itmag:itmag@db:5432/itmag
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  media:
